name: flutter_next_gen_ads
description: "Flutter wrapper for Google's GMA Next-Gen SDK 1.0+. Banner, interstitial, rewarded interstitial, and app open ads on Android."
version: 0.1.2
homepage: https://github.com/ahngo13/flutter_next_gen_ads
repository: https://github.com/ahngo13/flutter_next_gen_ads
issue_tracker: https://github.com/ahngo13/flutter_next_gen_ads/issues
funding:
  - https://github.com/sponsors/ahngo13
topics:
  - admob
  - ads
  - mobile-ads
  - android
  - monetization

environment:
  sdk: ^3.10.7
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.siwooeo.flutter_next_gen_ads
        pluginClass: NextGenAdsPlugin
