name: flutter_next_gen_ads_example
description: "Demonstrates how to use the flutter_next_gen_ads plugin."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local path dependency on the parent plugin.
  flutter_next_gen_ads:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
